<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{templates/default}">
<head>
    <title>Framework Components - Aspectow AppMon</title>
    <style>
        :root {
            --accent-color: #3ecf8e;
        }
        .left-panel, .right-panel {
            height: calc(100vh - 240px);
            min-height: 480px;
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 768px) {
            .left-panel {
                height: calc(100vh - 580px);
            }
        }
        .scrollable-pane {
            flex: 1;
            overflow-y: auto;
        }
        .component-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            padding: 12px 16px;
            border-bottom: 1px solid var(--bs-border-color);
            transition: background-color 0.15s ease-in-out;
        }
        .component-item:hover {
            background-color: var(--bs-tertiary-bg);
        }
        .component-item.active {
            background-color: rgba(62, 207, 142, 0.1);
            color: var(--accent-color);
            border-color: var(--accent-color);
            font-weight: 600;
        }
        .spec-card {
            border: 1px solid var(--bs-border-color);
            border-radius: var(--bs-border-radius);
            background-color: var(--bs-body-bg);
            margin-bottom: 1rem;
            overflow: hidden;
        }
        .spec-card:last-child {
            margin-bottom: 0;
        }
        .spec-card-header {
            background-color: var(--bs-tertiary-bg);
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.875rem;
            border-bottom: 1px solid var(--bs-border-color);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .spec-card-body {
            padding: 14px;
        }
        .spec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
        }
        @media (max-width: 767.98px) {
            .spec-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }
        .spec-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--bs-secondary-color);
            margin-bottom: 2px;
        }
        .spec-value {
            font-weight: 600;
            font-size: 0.95rem;
            word-break: break-all;
        }
        .spec-value-code {
            font-family: var(--bs-font-monospace);
            font-size: 0.85rem;
        }
        .prop-search-box {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bs-body-bg);
        }
        .table-responsive th {
            white-space: nowrap;
        }

        /* APON Syntax Highlighting */
        .apon-comment {
            color: var(--bs-secondary-color);
            font-style: italic;
        }
        .apon-key {
            color: var(--bs-link-color);
            font-weight: 600;
        }
        .apon-string {
            color: var(--bs-success);
        }
        .apon-keyword {
            color: var(--bs-danger);
            font-weight: 700;
        }
        .apon-bracket {
            color: var(--bs-body-color);
            font-weight: 700;
        }
        .apon-number {
            color: var(--bs-warning);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="row components-container gx-3 pt-3">
            <div class="col-md-4 left-panel mb-3 mb-md-0">
                <div class="card h-100 border shadow-sm overflow-hidden">
                    <div class="p-2 border-bottom">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" id="component-filter" class="form-control border-start-0" placeholder="Filter components..."/>
                        </div>
                    </div>
                    <div class="scrollable-pane p-0" id="components-list">
                        <div class="text-center p-5 text-muted">
                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                            Loading components...
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-8 right-panel">
                <div class="card border shadow-sm mb-3 flex-shrink-0">
                    <div class="card-body py-2 px-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <div class="d-flex align-items-center text-truncate me-auto">
                            <i id="details-icon" class="bi bi-layers me-2 text-primary flex-shrink-0"></i>
                            <span class="fw-bold small text-truncate" id="details-title">Component Specification</span>
                            <span id="details-category" class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle ms-2 small flex-shrink-0">Category</span>
                        </div>
                        <div class="d-flex align-items-center gap-1 ms-auto flex-shrink-0">
                            <button class="btn btn-sm btn-outline-secondary d-none" id="refresh-component-btn" title="Refresh component data">
                                <i class="bi bi-arrow-clockwise me-1"></i><span class="d-none d-sm-inline">Refresh</span>
                            </button>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-secondary" id="toggle-raw-btn" title="Toggle Raw APON View">
                                    <i class="bi bi-code-slash me-1"></i><span class="d-none d-sm-inline">Raw Data (APON)</span><span class="d-sm-none">APON</span>
                                </button>
                                <button class="btn btn-outline-secondary" id="copy-btn" title="Copy to clipboard">
                                    <i class="bi bi-clipboard"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="scrollable-pane">
                    <div id="spec-view">
                        <div class="card shadow-sm p-4 text-center text-muted">Select a component from the left panel to inspect its specifications.</div>
                    </div>
                    <div id="raw-view-pane" class="card h-100 shadow-sm d-none">
                        <pre id="raw-view" class="card-body m-0 overflow-auto" style="white-space: pre; font-size: 0.875rem;"></pre>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block layout:fragment="script">
        <script th:inline="javascript">
            $(function() {
                const contextPath = [[@{/}]].replace(/\/$/, '');
                const $componentsList = $('#components-list');
                const $specView = $('#spec-view');
                const $rawView = $('#raw-view');
                const $rawViewPane = $('#raw-view-pane');
                const $detailsTitle = $('#details-title');
                const $detailsIcon = $('#details-icon');
                const $detailsCategory = $('#details-category');
                const $contextTabs = $('#context-tabs');
                const $targetGroup = $('#target-group');
                const $groupStatus = $('#group-status');
                const $btnRefresh = $('#btn-refresh');
                const $toggleRawBtn = $('#toggle-raw-btn');
                const $refreshComponentBtn = $('#refresh-component-btn');

                let currentGroup = $targetGroup.val() || '';
                let currentContext = [[${page.contextName}]];
                let loadedComponentsData = {};
                let currentComponentKey = null;
                let isRawMode = false;

                function setStatus(status, text, bgClass) {
                    $groupStatus.text(text).removeClass("bg-success bg-warning bg-danger bg-secondary").addClass(bgClass);
                }

                function updateUrl(group, context) {
                    const url = new URL(window.location);
                    if (group) {
                        url.searchParams.set('group', group);
                    } else {
                        url.searchParams.delete('group');
                    }
                    if (context) {
                        url.pathname = contextPath + '/framework/components/' + encodeURIComponent(context);
                    }
                    window.history.replaceState({}, '', url);
                }

                function escapeHtml(str) {
                    if (str == null) return '';
                    return $('<div>').text(str).html();
                }

                function formatDuration(val) {
                    if (!val) return 'Default';
                    if (typeof val === 'string' && val.startsWith('PT')) {
                        return val.substring(2).toLowerCase();
                    }
                    return val;
                }

                function formatApon(obj) {
                    if (typeof APON !== 'undefined' && typeof APON.stringify === 'function') {
                        try {
                            return APON.stringify(obj, { indent: '  ', style: 'PRETTY' });
                        } catch (e) {
                            console.warn('Failed to stringify to APON:', e);
                        }
                    }
                    return JSON.stringify(obj, null, 2);
                }

                function renderComponentsList(componentsData) {
                    $componentsList.empty();
                    loadedComponentsData = componentsData || {};

                    if (!componentsData || Object.keys(componentsData).length === 0) {
                        $componentsList.html('<div class="p-3 text-muted">No components found in this context.</div>');
                        $specView.html('<div class="card border shadow-sm p-4 text-center text-muted">No components available.</div>');
                        return;
                    }

                    const $listGroup = $('<div/>', { 'class': 'list-group list-group-flush' });

                    $.each(componentsData, function(key, comp) {
                        const iconClass = comp.icon || 'bi-gear';
                        const countBadge = comp.itemCount > 1 ? `<span class="badge rounded-pill bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle ms-auto small">${comp.itemCount}</span>` : '';

                        const $item = $(`
                            <div class="list-group-item component-item" data-id="${key}">
                                <i class="bi ${iconClass} me-2 text-primary fs-5"></i>
                                <div>
                                    <div class="fw-bold">${escapeHtml(comp.displayName || key)}</div>
                                    <div class="small text-muted">${escapeHtml(comp.category || 'Component')}</div>
                                </div>
                                ${countBadge}
                            </div>
                        `);

                        $item.on('click', function() {
                            $('.component-item').removeClass('active');
                            $(this).addClass('active');
                            selectComponent(key);
                        });

                        $listGroup.append($item);
                    });

                    $componentsList.append($listGroup);
                    $componentsList.append('<div id="no-matching-components" class="p-3 text-muted text-center d-none"><i class="bi bi-search me-1"></i>No matching components</div>');

                    // Select previously selected component or first component by default
                    let targetKey = currentComponentKey;
                    if (!targetKey || !componentsData[targetKey]) {
                        targetKey = Object.keys(componentsData)[0];
                    }
                    if (targetKey) {
                        const $targetItem = $componentsList.find(`.component-item[data-id="${targetKey}"]`);
                        if ($targetItem.length > 0) {
                            $targetItem.trigger('click');
                        } else {
                            $componentsList.find('.component-item').first().trigger('click');
                        }
                    }
                }

                function selectComponent(key) {
                    currentComponentKey = key;
                    const comp = loadedComponentsData[key];
                    if (!comp) return;

                    $detailsTitle.text(comp.displayName || key);
                    $detailsCategory.text(comp.category || 'Component');
                    $detailsIcon.attr('class', 'bi ' + (comp.icon || 'bi-layers') + ' me-2 text-primary');

                    if (comp.refreshable) {
                        $refreshComponentBtn.removeClass('d-none');
                    } else {
                        $refreshComponentBtn.addClass('d-none');
                    }

                    // Raw view content (APON formatted & syntax highlighted)
                    const rawText = formatApon(comp);
                    $rawView.data('rawText', rawText);
                    if (typeof highlightApon === 'function') {
                        $rawView.html(highlightApon(rawText));
                    } else {
                        $rawView.text(rawText);
                    }

                    // Dedicated Spec View
                    renderSpecView(key, comp);
                }

                function renderSpecView(id, comp) {
                    $specView.empty();
                    const items = comp.items || [];
                    const props = comp.properties || {};

                    if (id === 'dataSource') {
                        renderDataSourceView(items);
                    } else if (id === 'asyncTaskExecutor') {
                        renderExecutorView(items);
                    } else if (id === 'environment') {
                        renderEnvironmentView(items, props);
                    } else if (id === 'multipartFormDataParser') {
                        renderMultipartView(items);
                    } else if (id === 'eventPublisher') {
                        renderEventPublisherView(items, props);
                    } else if (id === 'messageSource') {
                        renderMessageSourceView(items);
                    } else if (id === 'applicationAdapter') {
                        renderApplicationAdapterView(items);
                    } else if (id === 'sqlSessionFactory') {
                        renderSqlSessionFactoryView(items);
                    } else if (id === 'entityManagerFactory') {
                        renderEntityManagerFactoryView(items);
                    } else if (id === 'templateRenderer') {
                        renderTemplateRendererView(items);
                    } else if (id === 'schedulerService') {
                        renderSchedulerView(items);
                    } else if (id === 'sessionManager') {
                        renderSessionManagerView(items);
                    } else if (id === 'localeResolver') {
                        renderLocaleResolverView(items);
                    } else if (id === 'corsProcessor') {
                        renderCorsProcessorView(items);
                    } else if (id === 'redisClient') {
                        renderRedisClientView(items);
                    } else {
                        renderGenericView(items, props);
                    }
                }

                function renderDataSourceView(items) {
                    if (items.length === 0) {
                        $specView.html('<div class="card border shadow-sm p-4 text-center text-muted">No DataSources defined.</div>');
                        return;
                    }
                    $.each(items, function(i, ds) {
                        const card = $(`
                            <div class="spec-card shadow-sm">
                                <div class="spec-card-header">
                                    <span><i class="bi bi-database me-2"></i>${escapeHtml(ds.beanName || 'DataSource')}</span>
                                    <span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">${escapeHtml(ds.simpleClassName || '')}</span>
                                </div>
                                <div class="spec-card-body">
                                    <div class="mb-3">
                                        <div class="spec-label">JDBC URL</div>
                                        <div class="spec-value spec-value-code text-primary">${escapeHtml(ds.jdbcUrl || 'N/A')}</div>
                                    </div>
                                    <div class="spec-grid mb-3">
                                        <div>
                                            <div class="spec-label">Driver Class</div>
                                            <div class="spec-value spec-value-code small">${escapeHtml(ds.driverClassName || 'N/A')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Username</div>
                                            <div class="spec-value">${escapeHtml(ds.username || 'N/A')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Pool Name</div>
                                            <div class="spec-value">${escapeHtml(ds.poolName || 'N/A')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Transaction Isolation</div>
                                            <div class="spec-value">${escapeHtml(ds.transactionIsolation || 'DEFAULT')}</div>
                                        </div>
                                    </div>
                                    <div class="p-3 bg-body-tertiary rounded mb-3 border">
                                        <div class="fw-bold small mb-2 text-uppercase text-muted">Pool Capacity Specifications</div>
                                        <div class="row g-2">
                                            <div class="col-6 col-sm-3">
                                                <div class="spec-label">Max Pool Size</div>
                                                <div class="spec-value fs-5 text-success">${ds.maximumPoolSize ?? 'N/A'}</div>
                                            </div>
                                            <div class="col-6 col-sm-3">
                                                <div class="spec-label">Min Idle</div>
                                                <div class="spec-value fs-5">${ds.minimumIdle ?? 'N/A'}</div>
                                            </div>
                                            <div class="col-6 col-sm-3">
                                                <div class="spec-label">Connection Timeout</div>
                                                <div class="spec-value">${ds.connectionTimeout != null ? ds.connectionTimeout + ' ms' : 'N/A'}</div>
                                            </div>
                                            <div class="col-6 col-sm-3">
                                                <div class="spec-label">Max Lifetime</div>
                                                <div class="spec-value">${ds.maxLifetime != null ? ds.maxLifetime + ' ms' : 'N/A'}</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <span class="badge ${ds.autoCommit ? 'bg-success-subtle text-success-emphasis border border-success-subtle' : 'bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle'}">Auto-Commit: ${ds.autoCommit ? 'ON' : 'OFF'}</span>
                                        <span class="badge ${ds.readOnly ? 'bg-warning-subtle text-warning-emphasis border border-warning-subtle' : 'bg-body-secondary text-body-secondary border'}">Read-Only: ${ds.readOnly ? 'YES' : 'NO'}</span>
                                    </div>
                                </div>
                            </div>
                        `);
                        $specView.append(card);
                    });
                }

                function renderExecutorView(items) {
                    if (items.length === 0) {
                        $specView.html('<div class="card border shadow-sm p-4 text-center text-muted">No Task Executors defined.</div>');
                        return;
                    }
                    $.each(items, function(i, exec) {
                        const card = $(`
                            <div class="spec-card shadow-sm">
                                <div class="spec-card-header">
                                    <span><i class="bi bi-cpu me-2"></i>${escapeHtml(exec.beanName || 'TaskExecutor')}</span>
                                    <span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">${escapeHtml(exec.simpleClassName || '')}</span>
                                </div>
                                <div class="spec-card-body">
                                    <div class="p-3 bg-body-tertiary rounded mb-3 border">
                                        <div class="fw-bold small mb-2 text-uppercase text-muted">Thread Pool Specifications</div>
                                        <div class="row g-2">
                                            <div class="col-6 col-sm-3">
                                                <div class="spec-label">Core Pool Size</div>
                                                <div class="spec-value fs-4 text-primary">${exec.corePoolSize ?? 'N/A'}</div>
                                            </div>
                                            <div class="col-6 col-sm-3">
                                                <div class="spec-label">Max Pool Size</div>
                                                <div class="spec-value fs-4 text-info">${exec.maxPoolSize ?? 'N/A'}</div>
                                            </div>
                                            <div class="col-6 col-sm-3">
                                                <div class="spec-label">Queue Capacity</div>
                                                <div class="spec-value fs-4">${exec.queueCapacity ?? 'N/A'}</div>
                                            </div>
                                            <div class="col-6 col-sm-3">
                                                <div class="spec-label">Keep-Alive (s)</div>
                                                <div class="spec-value fs-4">${exec.keepAliveSeconds != null ? exec.keepAliveSeconds + 's' : 'N/A'}</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="spec-grid mb-3">
                                        <div>
                                            <div class="spec-label">Queue Type</div>
                                            <div class="spec-value spec-value-code">${escapeHtml(exec.queueType || 'Standard Blocking Queue')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Thread Name Prefix</div>
                                            <div class="spec-value spec-value-code text-muted">${escapeHtml(exec.threadNamePrefix || '(none)')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Rejection Policy</div>
                                            <div class="spec-value">${escapeHtml(exec.rejectionPolicy || 'AbortPolicy')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Allow Core Thread Timeout</div>
                                            <div class="spec-value">${exec.allowCoreThreadTimeOut ? 'Yes' : 'No'}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `);
                        $specView.append(card);
                    });
                }

                function renderEnvironmentView(items, props) {
                    const activeProfiles = props.activeProfiles || (items[0] && items[0].activeProfiles) || [];
                    const defaultProfiles = props.defaultProfiles || (items[0] && items[0].defaultProfiles) || [];
                    const sysSummary = props.systemSummary || (items[0] && items[0].systemSummary) || {};
                    const appProps = props.properties || (items[0] && items[0].properties) || {};

                    let activeBadges = activeProfiles.map(p => `<span class="badge bg-success-subtle text-success-emphasis border border-success-subtle me-1">${escapeHtml(p)}</span>`).join('');
                    if (!activeBadges) activeBadges = '<span class="text-muted small">None</span>';

                    let defaultBadges = defaultProfiles.map(p => `<span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle me-1">${escapeHtml(p)}</span>`).join('');
                    if (!defaultBadges) defaultBadges = '<span class="text-muted small">None</span>';

                    const card = $(`
                        <div class="spec-card shadow-sm">
                            <div class="spec-card-header">
                                <span><i class="bi bi-gear-wide-connected me-2"></i>Environment Profiles & System Summary</span>
                            </div>
                            <div class="spec-card-body">
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <div class="spec-label">Active Profiles</div>
                                        <div class="mt-1">${activeBadges}</div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="spec-label">Default Profiles</div>
                                        <div class="mt-1">${defaultBadges}</div>
                                    </div>
                                </div>
                                <div class="p-3 bg-body-tertiary rounded border">
                                    <div class="fw-bold small mb-2 text-uppercase text-muted">JVM & Platform Specifications</div>
                                    <div class="spec-grid">
                                        ${Object.entries(sysSummary).map(([k, v]) => `
                                            <div>
                                                <div class="spec-label">${escapeHtml(k)}</div>
                                                <div class="spec-value spec-value-code small">${escapeHtml(v || '')}</div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="spec-card shadow-sm">
                            <div class="spec-card-header d-flex justify-content-between align-items-center">
                                <span><i class="bi bi-card-list me-2"></i>Application Properties (${Object.keys(appProps).length})</span>
                                <input type="text" id="prop-filter" class="form-control form-control-sm w-auto" placeholder="Filter property key/value..."/>
                            </div>
                            <div class="spec-card-body p-0">
                                <div class="table-responsive" style="max-height: 400px; overflow-y: auto;">
                                    <table class="table table-hover table-striped table-sm mb-0 align-middle">
                                        <thead class="sticky-top bg-body-tertiary">
                                            <tr>
                                                <th class="ps-2">Property Key</th>
                                                <th>Configured Value</th>
                                            </tr>
                                        </thead>
                                        <tbody id="prop-table-body">
                                            ${Object.keys(appProps).length > 0 ? Object.entries(appProps).map(([k, v]) => `
                                                <tr class="prop-row">
                                                    <td class="spec-value-code small ps-2 fw-bold">${escapeHtml(k)}</td>
                                                    <td class="spec-value-code small ${v === '********' ? 'text-danger' : 'text-primary'}">${escapeHtml(v)}</td>
                                                </tr>
                                            `).join('') + `
                                                <tr id="no-matching-props" class="d-none">
                                                    <td colspan="2" class="text-muted text-center py-3"><i class="bi bi-search me-1"></i>No matching properties</td>
                                                </tr>
                                            ` : `
                                                <tr>
                                                    <td colspan="2" class="text-muted text-center py-3">No application properties configured</td>
                                                </tr>
                                            `}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `);

                    $specView.append(card);

                    // Property filter handler
                    $('#prop-filter').on('input', function() {
                        const q = $(this).val().toLowerCase().trim();
                        let matchCount = 0;
                        $('.prop-row').each(function() {
                            const text = $(this).text().toLowerCase();
                            const matches = text.includes(q);
                            $(this).toggle(matches);
                            if (matches) matchCount++;
                        });
                        $('#no-matching-props').toggleClass('d-none', matchCount > 0);
                    });
                }

                function renderMultipartView(items) {
                    if (items.length === 0) {
                        $specView.html('<div class="card border shadow-sm p-4 text-center text-muted">No Multipart Parser configured.</div>');
                        return;
                    }
                    $.each(items, function(i, mp) {
                        let allowed = mp.allowedFileExtensions ? (Array.isArray(mp.allowedFileExtensions) ? mp.allowedFileExtensions : [mp.allowedFileExtensions]) : [];
                        let denied = mp.deniedFileExtensions ? (Array.isArray(mp.deniedFileExtensions) ? mp.deniedFileExtensions : [mp.deniedFileExtensions]) : [];

                        const reqFormatted = mp.maxRequestSizeFormatted || (mp.maxRequestSize != null ? (mp.maxRequestSize < 0 ? 'Unlimited' : mp.maxRequestSize + ' B') : 'Unlimited');
                        const reqSub = (mp.maxRequestSize != null && mp.maxRequestSize >= 0) ? '(' + Number(mp.maxRequestSize).toLocaleString() + ' bytes)' : (mp.maxRequestSize != null && mp.maxRequestSize < 0 ? '(No size limit)' : '');

                                                <div class="spec-value fs-4 text-primary">${Number(sc.scheduleRulesCount || 0).toLocaleString()}</div>
                                                <div class="small text-muted">Configured rules</div>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="p-3 bg-body-tertiary rounded border h-100">
                                                <div class="spec-label">Jobs Executed</div>
                                                <div class="spec-value fs-4 text-success">${sc.numberOfJobsExecuted != null ? Number(sc.numberOfJobsExecuted).toLocaleString() : 'N/A'}</div>
                                                <div class="small text-muted">Cumulative run count</div>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="p-3 bg-body-tertiary rounded border h-100">
                                                <div class="spec-label">Thread Pool Size</div>
                                                <div class="spec-value fs-4 text-info">${sc.threadPoolSize != null ? sc.threadPoolSize : 'Default'}</div>
                                                <div class="small text-muted">${escapeHtml(sc.threadPoolClass || 'QuartzThreadPool')}</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="spec-grid mb-3">
                                        <div>
                                            <div class="spec-label">Instance ID</div>
                                            <div class="spec-value spec-value-code small">${escapeHtml(sc.schedulerInstanceId || 'N/A')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Clustered</div>
                                            <div class="spec-value">${sc.isClustered ? '<span class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle">Clustered</span>' : 'Standalone'}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Job Store</div>
                                            <div class="spec-value spec-value-code small">${escapeHtml(sc.jobStoreClass || 'N/A')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Distributed Job Lock</div>
                                            <div class="spec-value spec-value-code small">${escapeHtml(sc.jobLockProviderSimpleClassName || '(None)')}</div>
                                        </div>
                                    </div>
                                    <div>
                                        <div class="spec-label mb-1">Registered Schedules</div>
                                        <div class="table-responsive border rounded bg-body-tertiary">
                                            <table class="table table-sm table-hover mb-0">
                                                <thead>
                                                    <tr>
                                                        <th class="ps-2">Schedule ID</th>
                                                        <th>Trigger Type</th>
                                                        <th class="pe-2 text-end">Job Count</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    ${rulesRows}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `);
                        $specView.append(card);
                    });
                }

                function renderSessionManagerView(items) {
                    if (items.length === 0) {
                        $specView.html('<div class="card border shadow-sm p-4 text-center text-muted">No SessionManager configured.</div>');
                        return;
                    }
                    $.each(items, function(i, sm) {
                        const storeLocation = sm.storeDir || sm.redisUri;
                        const storeLocIcon = sm.redisUri ? 'bi-hdd-network text-primary' : (sm.storeDir ? 'bi-folder2-open text-warning' : 'bi-cpu text-secondary');
                        const storeLocHtml = storeLocation ? `
                            <div class="mb-3">
                                <div class="spec-label">Store Location / URI</div>
                                <div class="spec-value spec-value-code p-2 bg-body-tertiary border rounded">
                                    <i class="bi ${storeLocIcon} me-2"></i>${escapeHtml(storeLocation)}
                                </div>
                            </div>
                        ` : '';

                        const card = $(`
                            <div class="spec-card shadow-sm">
                                <div class="spec-card-header">
                                    <span><i class="bi bi-clock-history me-2"></i>${escapeHtml(sm.beanName || 'SessionManager')}</span>
                                    <span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">${escapeHtml(sm.simpleClassName || '')}</span>
                                </div>
                                <div class="spec-card-body">
                                    <div class="row g-3 mb-3">
                                        <div class="col-md-4">
                                            <div class="p-3 bg-body-tertiary rounded border h-100">
                                                <div class="spec-label">Default Max Idle (Timeout)</div>
                                                <div class="spec-value fs-4 text-primary">${escapeHtml(sm.defaultMaxIdleSecsFormatted || 'Unlimited')}</div>
                                                <div class="small text-muted">${sm.defaultMaxIdleSecs != null ? sm.defaultMaxIdleSecs + ' seconds' : ''}</div>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="p-3 bg-body-tertiary rounded border h-100">
                                                <div class="spec-label">Max Active Sessions Limit</div>
                                                <div class="spec-value fs-4 text-success">${sm.maxActiveSessions > 0 ? Number(sm.maxActiveSessions).toLocaleString() : 'Unlimited'}</div>
                                                <div class="small text-muted">Per-node cache limit</div>
                                            </div>
                                        </div>
                                        <div class="col-md-4">
                                            <div class="p-3 bg-body-tertiary rounded border h-100">
                                                <div class="spec-label">Session Clustering</div>
                                                <div class="spec-value fs-4 text-info">${sm.clusterEnabled ? 'Cluster' : 'Standalone'}</div>
                                                <div class="small text-muted">${escapeHtml(sm.sessionStoreSimpleClassName || 'In-Memory')}</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="spec-grid mb-3">
                                        <div>
                                            <div class="spec-label">Session Cache</div>
                                            <div class="spec-value spec-value-code small">${escapeHtml(sm.cacheSimpleClassName || 'DefaultSessionCache')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Session Store</div>
                                            <div class="spec-value spec-value-code small">${escapeHtml(sm.sessionStoreSimpleClassName || 'In-Memory')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Max Idle (New Sessions)</div>
                                            <div class="spec-value">${escapeHtml(sm.maxIdleSecsForNewFormatted || 'Default')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Scavenging Interval</div>
                                            <div class="spec-value">${escapeHtml(sm.scavengingIntervalFormatted || 'Default')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Cache Eviction Idle Time</div>
                                            <div class="spec-value">${escapeHtml(sm.evictionIdleSecsFormatted || 'N/A')}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Save On Create</div>
                                            <div class="spec-value">${sm.saveOnCreate ? '<span class="badge bg-success-subtle text-success-emphasis border border-success-subtle">true</span>' : 'false'}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Remove Unloadable Sessions</div>
                                            <div class="spec-value">${sm.removeUnloadableSessions ? '<span class="badge bg-danger-subtle text-danger-emphasis border border-danger-subtle">true</span>' : 'false'}</div>
                                        </div>
                                    </div>
                                    ${storeLocHtml}
                                </div>
                            </div>
                        `);
                        $specView.append(card);
                    });
                }

                function renderLocaleResolverView(items) {
                    if (items.length === 0) {
                        $specView.html('<div class="card border shadow-sm p-4 text-center text-muted">No LocaleResolver configured.</div>');
                        return;
                    }
                    $.each(items, function(i, lr) {
                        let supportedBadges = '';
                        if (lr.supportedLocales && lr.supportedLocales.length > 0) {
                            supportedBadges = lr.supportedLocales.map(l => `<span class="badge bg-primary-subtle text-primary-emphasis border border-primary-subtle me-1 mb-1">${escapeHtml(l)}</span>`).join('');
                        } else {
                            supportedBadges = '<span class="text-muted small">All supported</span>';
                        }

                        const card = $(`
                            <div class="spec-card shadow-sm">
                                <div class="spec-card-header">
                                    <span><i class="bi bi-globe2 me-2"></i>${escapeHtml(lr.beanName || 'LocaleResolver')}</span>
                                    <span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">${escapeHtml(lr.simpleClassName || '')}</span>
                                </div>
                                <div class="spec-card-body">
                                    <div class="row g-3 mb-3">
                                        <div class="col-md-6">
                                            <div class="p-3 bg-body-tertiary rounded border h-100">
                                                <div class="spec-label">Default Locale</div>
                                                <div class="spec-value fs-4 text-primary">${escapeHtml(lr.defaultLocale || 'System Default')}</div>
                                                <div class="small text-muted">Timezone: ${escapeHtml(lr.defaultTimeZone || 'System Default')}</div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="p-3 bg-body-tertiary rounded border h-100">
                                                <div class="spec-label">Supported Locales</div>
                                                <div class="mt-2">${supportedBadges}</div>
                                            </div>
                                        </div>
                                    </div>
                                    ${lr.cookieName ? `
                                        <div class="spec-label mb-1">Cookie Settings</div>
                                        <div class="spec-grid p-3 bg-body-tertiary border rounded mb-3">
                                            <div>
                                                <div class="spec-label">Cookie Name</div>
                                                <div class="spec-value spec-value-code small">${escapeHtml(lr.cookieName)}</div>
                                            </div>
                                            <div>
                                                <div class="spec-label">Max Age</div>
                                                <div class="spec-value">${lr.cookieMaxAge != null ? lr.cookieMaxAge + 's' : 'Session'}</div>
                                            </div>
                                            <div>
                                                <div class="spec-label">Path</div>
                                                <div class="spec-value spec-value-code small">${escapeHtml(lr.cookiePath || '/')}</div>
                                            </div>
                                            <div>
                                                <div class="spec-label">Domain</div>
                                                <div class="spec-value">${escapeHtml(lr.cookieDomain || '(Current Domain)')}</div>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        `);
                        $specView.append(card);
                    });
                }

                function renderCorsProcessorView(items) {
                    if (items.length === 0) {
                        $specView.html('<div class="card border shadow-sm p-4 text-center text-muted">No CORS Processor configured.</div>');
                        return;
                    }
                    $.each(items, function(i, cors) {
                        const renderBadges = (arr, colorClass) => {
                            if (!arr || arr.length === 0) return '<span class="text-muted small">None</span>';
                            return arr.map(item => `<span class="badge border ${colorClass} me-1 mb-1">${escapeHtml(item)}</span>`).join('');
                        };

                        const card = $(`
                            <div class="spec-card shadow-sm">
                                <div class="spec-card-header">
                                    <span><i class="bi bi-shield-check me-2"></i>${escapeHtml(cors.beanName || 'CorsProcessor')}</span>
                                    <span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">${escapeHtml(cors.simpleClassName || '')}</span>
                                </div>
                                <div class="spec-card-body">
                                    <div class="row g-3 mb-3">
                                        <div class="col-md-6">
                                            <div class="p-3 bg-body-tertiary rounded border h-100">
                                                <div class="spec-label">Allowed Origins</div>
                                                <div class="mt-2">${renderBadges(cors.allowedOrigins, 'bg-primary-subtle text-primary-emphasis border-primary-subtle')}</div>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="p-3 bg-body-tertiary rounded border h-100">
                                                <div class="spec-label">Allowed Methods</div>
                                                <div class="mt-2">${renderBadges(cors.allowedMethods, 'bg-info-subtle text-info-emphasis border-info-subtle')}</div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="spec-grid mb-3">
                                        <div>
                                            <div class="spec-label">Allow Credentials</div>
                                            <div class="spec-value">${cors.allowCredentials ? '<span class="badge bg-success-subtle text-success-emphasis border border-success-subtle">true</span>' : 'false'}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Preflight Max Age</div>
                                            <div class="spec-value">${cors.maxAgeSeconds != null ? cors.maxAgeSeconds + 's' : 'Default'}</div>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <div class="spec-label mb-1">Allowed Headers</div>
                                        <div class="p-2 bg-body-tertiary border rounded">
                                            ${renderBadges(cors.allowedHeaders, 'bg-secondary-subtle text-secondary-emphasis border-secondary-subtle')}
                                        </div>
                                    </div>
                                    <div>
                                        <div class="spec-label mb-1">Exposed Headers</div>
                                        <div class="p-2 bg-body-tertiary border rounded">
                                            ${renderBadges(cors.exposedHeaders, 'bg-secondary-subtle text-secondary-emphasis border-secondary-subtle')}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `);
                        $specView.append(card);
                    });
                }

                function renderRedisClientView(items) {
                    if (items.length === 0) {
                        $specView.html('<div class="card border shadow-sm p-4 text-center text-muted">No Redis Client or Pool configured.</div>');
                        return;
                    }
                    $.each(items, function(i, rc) {
                        const card = $(`
                            <div class="spec-card shadow-sm">
                                <div class="spec-card-header">
                                    <span><i class="bi bi-layers-half me-2"></i>${escapeHtml(rc.beanName || 'RedisClient')}</span>
                                    <span class="badge bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle">${escapeHtml(rc.simpleClassName || '')}</span>
                                </div>
                                <div class="spec-card-body">
                                    <div class="mb-3">
                                        <div class="spec-label">Redis URI / Endpoint</div>
                                        <div class="spec-value spec-value-code text-primary">${escapeHtml(rc.redisUri || (rc.host ? rc.host + ':' + rc.port : 'N/A'))}</div>
                                    </div>
                                    <div class="spec-grid">
                                        <div>
                                            <div class="spec-label">Database Index</div>
                                            <div class="spec-value">${rc.database != null ? rc.database : 0}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Pool Size</div>
                                            <div class="spec-value"><span class="badge bg-info-subtle text-info-emphasis border border-info-subtle">${rc.poolSize || 'Default'}</span></div>
                                        </div>
                                        <div>
                                            <div class="spec-label">SSL / TLS</div>
                                            <div class="spec-value">${rc.ssl ? '<span class="badge bg-success-subtle text-success-emphasis border border-success-subtle">Enabled</span>' : 'Disabled'}</div>
                                        </div>
                                        <div>
                                            <div class="spec-label">Command Timeout</div>
                                            <div class="spec-value">${escapeHtml(formatDuration(rc.timeout))}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `);
                        $specView.append(card);
                    });
                }

                function renderGenericView(items, props) {
                    const rawData = (items && items.length > 0) ? items : props;
                    const aponText = formatApon(rawData);
                    const highlighted = (typeof highlightApon === 'function') ? highlightApon(aponText) : escapeHtml(aponText);
                    const card = $(`
                        <div class="spec-card shadow-sm">
                            <div class="spec-card-header">
                                <span><i class="bi bi-layers me-2"></i>Specifications</span>
                            </div>
                            <div class="spec-card-body">
                                <pre class="m-0" style="white-space: pre; overflow-x: auto; font-size: 0.875rem;">${highlighted}</pre>
                            </div>
                        </div>
                    `);
                    $specView.append(card);
                }

                function loadComponentsData(group, context, forceRefresh, keepList) {
                    setStatus('loading', 'LOADING...', 'bg-warning');
                    if (!keepList) {
                        $componentsList.html(`
                            <div class="text-center p-5 text-muted">
                                <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                Loading components...
                            </div>
                        `);
                    }

                    const params = {
                        group: group || '',
                        contextName: context || '',
                        refresh: forceRefresh ? 'true' : 'false'
                    };

                    $.getJSON(contextPath + '/framework/components/data', params)
                        .done(function(data) {
                            if (data.componentsData) {
                                renderComponentsList(data.componentsData);
                                setStatus('ready', 'READY', 'bg-success');
                            } else if (data.error) {
                                $componentsList.html(`<div class="p-3 text-danger"><i class="bi bi-exclamation-triangle-fill me-1"></i> ${data.error.message || 'Error loading data'}</div>`);
                                setStatus('error', 'ERROR', 'bg-danger');
                            } else {
                                $componentsList.html('<div class="p-3 text-danger">Failed to load components data.</div>');
                                setStatus('error', 'ERROR', 'bg-danger');
                            }
                        })
                        .fail(function(xhr) {
                            const err = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error.message : 'Server error occurred.';
                            $componentsList.html(`<div class="p-3 text-danger"><i class="bi bi-exclamation-octagon-fill me-1"></i> ${err}</div>`);
                            setStatus('failed', 'FAILED', 'bg-danger');
                        });
                }

                function renderContextTabs(contextNames, activeContext) {
                    $contextTabs.empty();
                    if (!contextNames || contextNames.length === 0) {
                        $contextTabs.append('<li class="nav-item"><span class="nav-link disabled text-muted">No contexts</span></li>');
                        return;
                    }
                    $.each(contextNames, function(i, name) {
                        const isActive = (name === activeContext);
                        const $item = $(`
                            <li class="nav-item">
                                <a class="nav-link context-tab ${isActive ? 'active' : ''}" href="javascript:void(0)" data-context="${name}">
                                    <i class="bi bi-pc-display-horizontal me-1"></i>
                                    <span>${name}</span>
                                </a>
                            </li>
                        `);
                        $contextTabs.append($item);
                    });
                }

                function switchGroup(group, forceRefresh) {
                    currentGroup = group;
                    setStatus('loading', 'FETCHING CONTEXTS...', 'bg-warning');

                    $.getJSON(contextPath + '/framework/components/contexts', { group: group })
                        .done(function(res) {
                            const contextNames = res.allContextNames || [];
                            if (contextNames.length > 0) {
                                if (!contextNames.includes(currentContext)) {
                                    currentContext = contextNames[0];
                                }
                            } else {
                                currentContext = '';
                            }
                            renderContextTabs(contextNames, currentContext);
                            updateUrl(currentGroup, currentContext);
                            if (currentContext) {
                                loadComponentsData(currentGroup, currentContext, forceRefresh);
                            } else {
                                $componentsList.html('<div class="p-3 text-muted">No active context found in target group.</div>');
                                setStatus('empty', 'NO CONTEXTS', 'bg-secondary');
                            }
                        })
                        .fail(function(xhr) {
                            const err = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error.message : 'Failed to query contexts.';
                            $componentsList.html(`<div class="p-3 text-danger"><i class="bi bi-exclamation-triangle-fill me-1"></i> ${err}</div>`);
                            setStatus('error', 'ERROR', 'bg-danger');
                        });
                }

                // Event Listeners
                $targetGroup.on('change', function() {
                    switchGroup($(this).val(), false);
                });

                $btnRefresh.on('click', function() {
                    const $icon = $(this).find('i');
                    $icon.addClass('spin');
                    loadComponentsData(currentGroup, currentContext, true);
                    setTimeout(() => $icon.removeClass('spin'), 1000);
                });

                $refreshComponentBtn.on('click', function() {
                    const $btn = $(this);
                    const $icon = $btn.find('i');
                    $icon.addClass('spin');
                    $btn.prop('disabled', true);
                    loadComponentsData(currentGroup, currentContext, true, true);
                    setTimeout(() => {
                        $icon.removeClass('spin');
                        $btn.prop('disabled', false);
                    }, 600);
                });

                $(document).on('click', '.context-tab', function() {
                    const ctx = $(this).data('context');
                    if (ctx) {
                        currentContext = ctx;
                        $('.context-tab').removeClass('active');
                        $(this).addClass('active');
                        updateUrl(currentGroup, currentContext);
                        loadComponentsData(currentGroup, currentContext, false);
                    }
                });

                $('#component-filter').on('input', function() {
                    const filterText = $(this).val().trim().toLowerCase();
                    let matchCount = 0;
                    $('.component-item').each(function() {
                        const text = $(this).text().toLowerCase();
                        const matches = text.includes(filterText);
                        $(this).toggle(matches);
                        if (matches) matchCount++;
                    });
                    $('#no-matching-components').toggleClass('d-none', matchCount > 0);
                });

                $toggleRawBtn.on('click', function() {
                    isRawMode = !isRawMode;
                    if (isRawMode) {
                        $specView.addClass('d-none');
                        $rawViewPane.removeClass('d-none');
                        $(this).addClass('active btn-primary').removeClass('btn-outline-secondary');
                    } else {
                        $specView.removeClass('d-none');
                        $rawViewPane.addClass('d-none');
                        $(this).removeClass('active btn-primary').addClass('btn-outline-secondary');
                    }
                });

                $('#copy-btn').on('click', function() {
                    let text = $rawView.data('rawText');
                    if (!text) {
                        const comp = loadedComponentsData[currentComponentKey];
                        if (comp) {
                            text = formatApon(comp);
                        }
                    }
                    if (text) {
                        navigator.clipboard.writeText(text).then(() => {
                            const $icon = $(this).find('i');
                            $icon.removeClass('bi-clipboard').addClass('bi-check-lg text-success');
                            setTimeout(() => $icon.removeClass('bi-check-lg text-success').addClass('bi-clipboard'), 2000);
                        });
                    }
                });

                // Initial Load
                loadComponentsData(currentGroup, currentContext, false);
            });
        </script>
    </th:block>
</body>
</html>
