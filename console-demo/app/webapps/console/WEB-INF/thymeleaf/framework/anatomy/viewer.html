<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{templates/default}">
<head>
    <title>Framework Anatomy - Aspectow Console</title>
    <style>
        .left-panel, .right-panel {
            height: calc(100vh - 240px);
            min-height: 380px;
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 768px) {
            .left-panel {
                height: calc(100vh - 580px);
            }
        }
        .scrollable-pane {
            flex: 1;
            overflow-y: auto;
        }
        .rule-item {
            cursor: pointer;
            font-size: 0.875rem;
            padding: 8px 16px;
        }
        .rule-item:hover {
            background-color: var(--bs-tertiary-bg);
        }
        .rule-item.active {
            background-color: rgba(62, 207, 142, 0.1);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }
        .component-header {
            font-weight: 700;
            background-color: var(--bs-tertiary-bg);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-bottom: 1px solid var(--bs-border-color);
        }
        .component-header:not(.collapsed) {
            color: var(--accent-color);
        }
    </style>
</head>
<body>
    <th:block layout:fragment="content">
        <div class="card target-selector" th:if="${page.groups != null && page.groups.size() > 0}">
            <div class="row align-items-center g-2">
                <div class="col-12 col-sm-auto">
                    <label class="fw-bold small text-muted text-uppercase mb-0">Target Group</label>
                </div>
                <div class="col-12 col-sm-auto">
                    <select id="target-group" class="form-select form-select-sm" style="min-width: 220px;">
                        <option value="" th:selected="${page.selectedGroup == null || page.selectedGroup == ''}">
                            Local Node <span th:if="${page.myGroupId != null}">([[${page.myGroupId}]])</span>
                        </option>
                        <option th:each="g : ${page.groups}"
                                th:value="${g.name}"
                                th:selected="${page.selectedGroup == g.name}"
                                th:text="${g.name + ' (' + g.nodeCount + (g.nodeCount == 1 ? ' Node' : ' Nodes') + ')' + (!g.hasCommandManager ? ' [NO COMMAND MANAGER]' : '')}"
                                th:classappend="${!g.hasCommandManager ? 'text-secondary' : ''}">
                        </option>
                    </select>
                </div>
                <div class="col-auto">
                    <button id="btn-refresh" class="btn btn-sm btn-outline-secondary" title="Refresh Anatomy Data">
                        <i class="bi bi-arrow-clockwise"></i>
                    </button>
                </div>
                <div class="col text-end">
                    <span id="group-status" class="badge status-pill bg-success">READY</span>
                </div>
            </div>
        </div>

        <div class="anatomy-tabs mb-3">
            <ul class="nav nav-btn-tabs" id="context-tabs">
                <li class="nav-item" th:each="name : ${page.allContextNames}">
                    <a class="nav-link context-tab"
                       href="javascript:void(0)"
                       th:data-context="${name}"
                       th:classappend="${page.contextName == name} ? 'active' : ''">
                        <i class="bi bi-pc-display-horizontal me-1"></i>
                        <span th:text="${name}">Context Name</span>
                    </a>
                </li>
            </ul>
        </div>
        <div class="row anatomy-container gx-3">
            <div class="col-md-4 left-panel mb-3 mb-md-0">
                <div class="card h-100 border shadow-sm overflow-hidden">
                    <div class="p-2 border-bottom">
                        <div class="input-group input-group-sm">
                            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search"></i></span>
                            <input type="text" id="rule-filter" class="form-control border-start-0" placeholder="Filter rules..."/>
                        </div>
                    </div>
                    <div class="scrollable-pane p-0" id="component-tree">
                        <div class="text-center p-5 text-muted">
                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                            Loading anatomy data...
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-8 right-panel">
                <div class="card h-100 border shadow-sm overflow-hidden">
                    <div class="card-header bg-body-tertiary py-2 d-flex justify-content-between align-items-center">
                        <span class="fw-bold small">Rule Details (APON)</span>
                        <button class="btn btn-sm btn-outline-secondary border-0" id="copy-btn" title="Copy to clipboard">
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>
                    <div class="card-body scrollable-pane text-body">
                        <pre id="details-content">Select a rule from the left panel to see details.</pre>
                    </div>
                </div>
            </div>
        </div>
    </th:block>

    <th:block layout:fragment="script">
        <script th:inline="javascript">
            $(function() {
                const contextPath = [[@{/}]].replace(/\/$/, '');
                const $componentTree = $('#component-tree');
                const $detailsContent = $('#details-content');
                const $contextTabs = $('#context-tabs');
                const $targetGroup = $('#target-group');
                const $groupStatus = $('#group-status');
                const $btnRefresh = $('#btn-refresh');

                let currentGroup = $targetGroup.val() || '';
                let currentContext = [[${page.contextName}]];

                function setStatus(status, text, bgClass) {
                    $groupStatus.text(text).removeClass("bg-success bg-warning bg-danger bg-secondary").addClass(bgClass);
                }

                function updateUrl(group, context) {
                    const url = new URL(window.location);
                    if (group) {
                        url.searchParams.set('group', group);
                    } else {
                        url.searchParams.delete('group');
                    }
                    if (context) {
                        url.pathname = contextPath + '/framework/anatomy/' + encodeURIComponent(context);
                    }
                    window.history.replaceState({}, '', url);
                }

                function renderAnatomyData(anatomyData) {
                    $componentTree.empty();
                    $detailsContent.text('Select a rule from the left panel to see details.');

                    if (!anatomyData || Object.keys(anatomyData).length === 0) {
                        $componentTree.html('<div class="p-3 text-muted">No rules found in this context.</div>');
                        return;
                    }

                    $.each(anatomyData, function(componentKey, rules) {
                        const componentId = 'comp-' + componentKey.replace(/\s+/g, '-').toLowerCase();

                        const $header = $('<div/>', {
                            'class': 'component-header collapsed',
                            'data-bs-toggle': 'collapse',
                            'data-bs-target': '#' + componentId,
                            'html': `<span>${componentKey}</span> <span class="badge rounded-pill bg-secondary small">${rules.length}</span>`
                        });

                        const $ruleList = $('<div/>', {
                            'id': componentId,
                            'class': 'collapse list-group list-group-flush border-bottom'
                        });

                        if (rules.length > 0) {
                            $.each(rules, function(index, rule) {
                                const ruleName = rule.name || rule.id || rule.className || 'Unnamed Rule';
                                const $ruleItem = $('<div/>', {
                                    'class': 'list-group-item rule-item',
                                    'text': ruleName,
                                    'data-apon': rule.apon
                                });

                                $ruleItem.on('click', function() {
                                    $('.rule-item').removeClass('active');
                                    $(this).addClass('active');

                                    if (typeof highlightApon === 'function') {
                                        $detailsContent.html(highlightApon(rule.apon));
                                    } else {
                                        $detailsContent.text(rule.apon || '');
                                    }
                                });

                                $ruleList.append($ruleItem);
                            });
                        } else {
                            $ruleList.append('<div class="list-group-item text-muted small px-3">No rules defined.</div>');
                        }

                        $componentTree.append($header).append($ruleList);
                    });
                }

                function loadAnatomyData(group, context, forceRefresh) {
                    setStatus('loading', 'LOADING...', 'bg-warning');
                    $componentTree.html(`
                        <div class="text-center p-5 text-muted">
                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                            Loading anatomy data...
                        </div>
                    `);

                    const params = {
                        group: group || '',
                        contextName: context || '',
                        refresh: forceRefresh ? 'true' : 'false'
                    };

                    $.getJSON(contextPath + '/framework/anatomy/data', params)
                        .done(function(data) {
                            if (data.anatomyData) {
                                renderAnatomyData(data.anatomyData);
                                setStatus('ready', 'READY', 'bg-success');
                            } else if (data.error) {
                                $componentTree.html(`<div class="p-3 text-danger"><i class="bi bi-exclamation-triangle-fill me-1"></i> ${data.error.message || 'Error loading data'}</div>`);
                                setStatus('error', 'ERROR', 'bg-danger');
                            } else {
                                $componentTree.html('<div class="p-3 text-danger">Failed to load anatomy data.</div>');
                                setStatus('error', 'ERROR', 'bg-danger');
                            }
                        })
                        .fail(function(xhr) {
                            const err = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error.message : 'Server error occurred.';
                            $componentTree.html(`<div class="p-3 text-danger"><i class="bi bi-exclamation-octagon-fill me-1"></i> ${err}</div>`);
                            setStatus('failed', 'FAILED', 'bg-danger');
                        });
                }

                function renderContextTabs(contextNames, activeContext) {
                    $contextTabs.empty();
                    if (!contextNames || contextNames.length === 0) {
                        $contextTabs.append('<li class="nav-item"><span class="nav-link disabled text-muted">No contexts</span></li>');
                        return;
                    }
                    $.each(contextNames, function(i, name) {
                        const isActive = (name === activeContext);
                        const $item = $(`
                            <li class="nav-item">
                                <a class="nav-link context-tab ${isActive ? 'active' : ''}" href="javascript:void(0)" data-context="${name}">
                                    <i class="bi bi-pc-display-horizontal me-1"></i>
                                    <span>${name}</span>
                                </a>
                            </li>
                        `);
                        $contextTabs.append($item);
                    });
                }

                function switchGroup(group, forceRefresh) {
                    currentGroup = group;
                    setStatus('loading', 'FETCHING CONTEXTS...', 'bg-warning');

                    $.getJSON(contextPath + '/framework/anatomy/contexts', { group: group })
                        .done(function(res) {
                            const contextNames = res.allContextNames || [];
                            if (contextNames.length > 0) {
                                if (!contextNames.includes(currentContext)) {
                                    currentContext = contextNames[0];
                                }
                            } else {
                                currentContext = '';
                            }
                            renderContextTabs(contextNames, currentContext);
                            updateUrl(currentGroup, currentContext);
                            if (currentContext) {
                                loadAnatomyData(currentGroup, currentContext, forceRefresh);
                            } else {
                                $componentTree.html('<div class="p-3 text-muted">No active context found in target group.</div>');
                                setStatus('empty', 'NO CONTEXTS', 'bg-secondary');
                            }
                        })
                        .fail(function(xhr) {
                            const err = (xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error.message : 'Failed to query contexts.';
                            $componentTree.html(`<div class="p-3 text-danger"><i class="bi bi-exclamation-triangle-fill me-1"></i> ${err}</div>`);
                            setStatus('error', 'ERROR', 'bg-danger');
                        });
                }

                // Event Listeners
                $targetGroup.on('change', function() {
                    switchGroup($(this).val(), false);
                });

                $btnRefresh.on('click', function() {
                    const $icon = $(this).find('i');
                    $icon.addClass('spin');
                    loadAnatomyData(currentGroup, currentContext, true);
                    setTimeout(() => $icon.removeClass('spin'), 1000);
                });

                $(document).on('click', '.context-tab', function() {
                    const ctx = $(this).data('context');
                    if (ctx) {
                        currentContext = ctx;
                        $('.context-tab').removeClass('active');
                        $(this).addClass('active');
                        updateUrl(currentGroup, currentContext);
                        loadAnatomyData(currentGroup, currentContext, false);
                    }
                });

                $('#rule-filter').on('keyup', function() {
                    const filterText = $(this).val().toLowerCase();
                    $('.component-header').each(function() {
                        const $header = $(this);
                        const $list = $header.next('.collapse');
                        let hasMatch = false;

                        $list.find('.rule-item').each(function() {
                            const $item = $(this);
                            if ($item.text().toLowerCase().includes(filterText)) {
                                $item.show();
                                hasMatch = true;
                            } else {
                                $item.hide();
                            }
                        });

                        if (hasMatch || filterText === '') {
                            $header.show();
                        } else {
                            $header.hide();
                        }
                    });
                });

                $('#copy-btn').on('click', function() {
                    const activeItem = $('.rule-item.active');
                    if (activeItem.length > 0) {
                        const text = activeItem.data('apon') || '';
                        navigator.clipboard.writeText(text).then(() => {
                            const $icon = $(this).find('i');
                            $icon.removeClass('bi-clipboard').addClass('bi-check-lg text-success');
                            setTimeout(() => $icon.removeClass('bi-check-lg text-success').addClass('bi-clipboard'), 2000);
                        });
                    }
                });

                // Initial Load
                loadAnatomyData(currentGroup, currentContext, false);
            });
        </script>
    </th:block>
</body>
</html>
