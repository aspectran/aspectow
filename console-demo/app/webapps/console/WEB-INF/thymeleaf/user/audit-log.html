<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{templates/default}">
<body>
<th:block layout:fragment="content">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-start gap-3 mb-3">
        <div>
            <h3 class="fw-bold mb-0 text-nowrap">
                <i class="bi bi-shield-check me-2"></i> 
                <span th:if="${!#strings.isEmpty(page.username)}" th:text="|Audit Log for '${page.username}'|">Audit Log</span>
                <span th:if="${#strings.isEmpty(page.username)}">Security Audit Log</span>
            </h3>
        </div>
        <div class="d-flex flex-wrap justify-content-end align-items-center gap-2">
            <span class="badge bg-secondary-subtle text-secondary border border-secondary-subtle fw-semibold text-nowrap me-1" id="total-audit-count" th:text="${page.pageInfo != null ? page.pageInfo.totalElements : (#lists.size(page.auditList))} + ' Records'">0 Records</span>
            <div class="btn-group btn-group-sm" role="group" aria-label="Quick Period">
                <button type="button" class="btn btn-outline-secondary" onclick="setPeriodPreset('today')">Today</button>
                <button type="button" class="btn btn-outline-secondary" onclick="setPeriodPreset('7d')">7D</button>
                <button type="button" class="btn btn-outline-secondary" onclick="setPeriodPreset('30d')">30D</button>
            </div>
            <div class="input-group input-group-sm" style="width: 250px;">
                <input type="date" id="audit-start-date" class="form-control" th:value="${page.dateRange?.startDate}" title="Start Date">
                <span class="input-group-text bg-body-tertiary text-muted">~</span>
                <input type="date" id="audit-end-date" class="form-control" th:value="${page.dateRange?.endDate}" title="End Date">
                <button th:if="${page.dateRange != null && page.dateRange.hasValue()}" class="btn btn-outline-secondary" type="button" onclick="clearDateRange()" title="Clear date range">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <div class="input-group input-group-sm" style="width: 180px;">
                <span class="input-group-text cursor-pointer" onclick="performSearch()"><i class="bi bi-search"></i></span>
                <input type="text" id="audit-search" class="form-control" placeholder="Search..." th:value="${page.searchKeyword}">
                <button th:if="${!#strings.isEmpty(page.searchKeyword)}" class="btn btn-outline-secondary" type="button" onclick="clearSearch()" title="Clear search">
                    <i class="bi bi-x"></i>
                </button>
            </div>
            <select class="form-select form-select-sm w-auto" id="pageSizeSelect">
                <option value="auto">Auto</option>
                <option value="10">10 / page</option>
                <option value="20">20 / page</option>
                <option value="30">30 / page</option>
                <option value="50">50 / page</option>
                <option value="100">100 / page</option>
            </select>
            <div th:if="${!#strings.isEmpty(page.username)}">
                <a th:href="@{/user/audit-log(size=${page.pageInfo.size})}" class="btn btn-outline-secondary btn-sm text-nowrap">Show All</a>
            </div>
        </div>
    </div>

    <div class="card shadow-sm overflow-hidden">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped text-nowrap align-middle mb-0">
                    <thead>
                    <tr>
                        <th class="ps-3 text-muted small text-uppercase" style="width: 60px;">ID</th>
                        <th class="text-muted small text-uppercase">Username</th>
                        <th class="text-muted small text-uppercase">Event Type</th>
                        <th class="text-muted small text-uppercase">Target</th>
                        <th class="text-muted small text-uppercase">Details</th>
                        <th class="text-muted small text-uppercase">IP Address</th>
                        <th class="pe-3 text-muted small text-uppercase">Time</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="audit : ${page.auditList}">
                        <td class="ps-3" th:text="${audit.auditId}">1</td>
                        <td>
                            <a th:href="@{/user/audit-log(username=${audit.username})}" 
                               class="text-decoration-none fw-bold" th:text="${audit.username}">admin</a>
                        </td>
                        <td>
                            <span th:class="${#strings.contains(audit.eventType, 'DELETE') ? 'badge bg-danger' : (#strings.contains(audit.eventType, 'CREATE') ? 'badge bg-success' : (#strings.contains(audit.eventType, 'VIEW') ? 'badge bg-info' : 'badge bg-warning'))}"
                                  th:text="${audit.eventType}">USER_CREATE</span>
                        </td>
                        <td class="fw-semibold text-primary" th:text="${audit.target}">admin</td>
                        <td class="small text-muted text-truncate" style="max-width: 300px;" 
                            th:text="${audit.details}" th:title="${audit.details}">Created new user</td>
                        <td th:text="${session.USER_INFO.hasRole('DEMO') ? (audit.ipAddress.indexOf('.') != -1 ? audit.ipAddress.replaceAll('(\\d+)\\.(\\d+)\\.(\\d+)\\.(\\d+)', '$1.$2.*.*') : (audit.ipAddress.indexOf(':') != -1 ? audit.ipAddress.replaceAll('(:[^:]*){1,4}$', ':*:*:*:*') : '***')) : audit.ipAddress}">127.0.0.1</td>
                        <td class="pe-3 small text-muted format-local-time" data-relative="both" th:data-utc="${audit.createdAt}" th:text="${audit.createdAt ?: '-'}">-</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(page.auditList)}">
                        <td colspan="7" class="text-center py-4 text-muted">No audit logs found.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <th:block th:replace="~{templates/fragments/pagination :: pagination(${page.pageInfo})}"></th:block>
</th:block>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        function performSearch() {
            const query = $.trim($('#audit-search').val());
            const startDate = $('#audit-start-date').val();
            const endDate = $('#audit-end-date').val();
            const urlParams = new URLSearchParams(window.location.search);
            if (query) {
                urlParams.set('searchKeyword', query);
            } else {
                urlParams.delete('searchKeyword');
            }
            if (startDate) {
                urlParams.set('startDate', startDate);
            } else {
                urlParams.delete('startDate');
            }
            if (endDate) {
                urlParams.set('endDate', endDate);
            } else {
                urlParams.delete('endDate');
            }
            urlParams.set('timeZone', getClientTimeZone());
            urlParams.set('page', '1');
            window.location.search = urlParams.toString();
        }

        function clearSearch() {
            const urlParams = new URLSearchParams(window.location.search);
            urlParams.delete('searchKeyword');
            urlParams.set('page', '1');
            window.location.search = urlParams.toString();
        }

        function clearDateRange() {
            $('#audit-start-date').val('');
            $('#audit-end-date').val('');
            performSearch();
        }

        function setPeriodPreset(preset) {
            const startInput = document.getElementById('audit-start-date');
            const endInput = document.getElementById('audit-end-date');
            if (!startInput || !endInput) return;
            const today = new Date();
            const formatDate = (d) => {
                const year = d.getFullYear();
                const month = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };
            endInput.value = formatDate(today);
            if (preset === 'today') {
                startInput.value = formatDate(today);
            } else if (preset === '7d') {
                const d = new Date();
                d.setDate(d.getDate() - 7);
                startInput.value = formatDate(d);
            } else if (preset === '30d') {
                const d = new Date();
                d.setDate(d.getDate() - 30);
                startInput.value = formatDate(d);
            }
            performSearch();
        }

        $(function() {
            initPageSizeControl({
                cookiePrefix: 'audit_log',
                renderedSize: [[${page.pageInfo.size}]]
            });

            $('#audit-search').on('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    performSearch();
                }
            });
            $('#audit-start-date, #audit-end-date').on('change', function() {
                performSearch();
            });
        });
    </script>
</th:block>
</body>
</html>
